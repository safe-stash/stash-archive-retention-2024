[package]
name = "safe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "A digital safe box"
homepage = "https://github.com/safe-stash/safe"
# documentation = "https://docs.rs/safe"
repository = "https://github.com/safe-stash/safe"
readme = "README.md"
keywords = ["cryptography", "vault", "password-manager", "safe-box"]
categories = ["cryptography"]

[dependencies]
aes = "0.8.2"
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.0.22", features = ["derive"] }
rpassword = "7.1.0"
scrypt = "0.10.0"
hex = "0.4.3"
rusqlite = { version = "0.28.0", features = ["bundled"] }
passworder = "0.1.2"
